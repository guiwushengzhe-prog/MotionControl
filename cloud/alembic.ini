# Alembic configuration.
#
# There is no sqlalchemy.url here on purpose. The URL comes from MC_DB_URL via
# app.settings, so there is exactly one place that decides which database is in
# use -- a second copy here is how a migration ends up run against the wrong
# one.
#
# Run from the repository root so that motioncontrol_shared is importable:
#
#     alembic -c cloud/alembic.ini upgrade head

[alembic]
script_location = cloud/migrations
prepend_sys_path = .
# Without this Alembic splits the path on spaces and colons too,
# which mangles any absolute Windows path.
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
