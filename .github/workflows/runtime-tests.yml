name: runtime-tests

on:
  push:
    paths:
      - 'motioncontrol/**'
      - 'motioncontrol_shared/**'
      - 'server.py'
      - 'web/**'
      - 'tests/**'
      - 'tools/**'
      - 'cloud/**'
      - 'config/**'
      - 'game_profiles/**'
      - 'release/**'
      - 'requirements-runtime.txt'
      - '.github/workflows/runtime-tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc-logic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - name: Install logic test dependencies
        run: python -m pip install pytest pytest-asyncio numpy opencv-python-headless cryptography qrcode==8.2 -r cloud/requirements.txt
      - name: Run desktop logic and packaging regression tests
        env:
          MOTIONCONTROL_USER_DIR: ${{ runner.temp }}/motioncontrol-test-user-data
        run: python -m pytest tests/ -q

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - name: Install cloud test dependencies
        run: python -m pip install pytest pytest-asyncio -r cloud/requirements.txt
      - name: Run migrations, API behavior and list query budget tests
        run: python -m pytest cloud/tests/ -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # 真实服务那几条界面测试会启动 server.py，它导入时就要 numpy、cv2 和 qrcode。
      - name: Install browser test dependencies
        run: python -m pip install pytest playwright numpy opencv-python-headless cryptography qrcode==8.2
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real browser regression tests
        env:
          MOTIONCONTROL_USER_DIR: ${{ runner.temp }}/motioncontrol-browser-test-user-data
        run: python -m pytest tests/test_web_*.py -q
